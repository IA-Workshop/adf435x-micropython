[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adf435x"
version = "0.1.0"
description = "MicroPython driver for the ADF4350/ADF4351 wideband PLL synthesizers with integrated VCO"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["adf4350", "adf4351", "pll", "synthesizer", "micropython", "rf"]

[project.optional-dependencies]
test = ["pytest"]

# Only the library package ships in a built distribution; tests/ and examples/
# are development-only. (For embedded use, deployment is copying the adf435x/
# folder to the board -- pyproject.toml is never deployed; see README.)
[tool.setuptools]
packages = ["adf435x"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "device: requires a connected ADF435x; skipped unless --device is given, and asserts digital values only",
]