name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          MIP=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          echo "tag=$VERSION pyproject=$PYPROJECT package.json=$MIP"
          test "$VERSION" = "$PYPROJECT" && test "$VERSION" = "$MIP"

      - name: Build zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "adf435x-${VERSION}.zip" adf435x/ \
            -x "*/__pycache__/*" "*.pyc"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: adf435x-*.zip
          generate_release_notes: true
